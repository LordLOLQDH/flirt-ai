<body><div class="app">

<script>

const APP_VERSION="1.2.1";
const VERSION_URL=new URL("./version.json",location.href);
function showVersionGate(title,detail,canRetry=true){
 let gate=document.getElementById("versionGate");
 if(!gate){gate=document.createElement("div");gate.id="versionGate";document.body.appendChild(gate)}
 gate.innerHTML='<div><h2>'+title+'</h2><p>'+detail+'</p>'+(canRetry?'<button id="versionRetry">Erneut prüfen</button>':'')+'</div>';
 const b=document.getElementById("versionRetry");if(b)b.onclick=()=>checkVersion(true);
}
async function checkVersion(manual=false){
 try{
  const u=new URL(VERSION_URL);u.searchParams.set("_",String(Date.now()));
  const r=await fetch(u.href,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
  if(!r.ok)throw new Error("Versionsdatei nicht erreichbar");
  const data=await r.json();
  if(!data.version)throw new Error("Ungültige Versionsdatei");
  if(data.version!==APP_VERSION){
   showVersionGate("Update wird geladen","Diese Version ("+APP_VERSION+") ist veraltet. Flirtly lädt Version "+data.version+" und sperrt die alte Oberfläche.");
   const target=new URL("./",location.href);target.searchParams.set("v",data.version);target.searchParams.set("refresh",String(Date.now()));
   if(location.search.includes("v="+encodeURIComponent(data.version))){
    setTimeout(()=>checkVersion(false),1800);
   }else{
    location.replace(target.href);
   }
   return false;
  }
  const gate=document.getElementById("versionGate");if(gate)gate.remove();
  document.body.style.overflow="";
  return true;
 }catch(e){
  showVersionGate("Version wird geprüft","Flirtly kann die aktuelle Version gerade nicht bestätigen. Der Chat bleibt gesperrt, bis die Prüfung erfolgreich ist.");
  setTimeout(()=>checkVersion(false),5000);
  return false;
 }
}
document.body.style.overflow="hidden";
showVersionGate("Flirtly wird geprüft","Aktuelle Version wird geladen. Einen Moment bitte.");
checkVersion();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion()});
window.addEventListener("pageshow",()=>checkVersion());
setInterval(()=>checkVersion(),30000);

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(-100)))}catch{}}
function render(){const box=$("messages");box.innerHTML="";if(!history.length){box.innerHTML=welcome;box.querySelectorAll("[data-prompt]").forEach(b=>b.onclick=()=>sendMessage(b.dataset.prompt));return}history.forEach(m=>{const row=document.createElement("div");row.className="msg "+(m.role==="user"?"user":"ai");const av=document.createElement("div");av.className="avatar";av.textContent=m.role==="user"?"•":"♡";const wrap=document.createElement("div"),bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content;wrap.appendChild(bubble);const meta=document.createElement("div");meta.className="meta";meta.textContent=m.role==="user"?"Du":"Flirtly";wrap.appendChild(meta);row.append(av,wrap);box.appendChild(row)});box.scrollTop=box.scrollHeight}
